name: iOS Build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Package Xcode source project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/QuietDriveLab-4.12-source"
          mkdir -p "$RUNNER_TEMP/QuietDriveLab-4.12-source"

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            ./ "$RUNNER_TEMP/QuietDriveLab-4.12-source/"

          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/QuietDriveLab-4.12-source" \
            "$RUNNER_TEMP/QuietDriveLab-4.12-xcode-project.zip"

      - name: Upload Xcode source project
        uses: actions/upload-artifact@v4
        with:
          name: QuietDriveLab-4.12-xcode-project
          path: ${{ runner.temp }}/QuietDriveLab-4.12-xcode-project.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build app and tests for simulator
        run: >-
          xcodebuild
          -project QuietDriveLab.xcodeproj
          -scheme QuietDriveLab
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Package simulator app
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(
            find "$HOME/Library/Developer/Xcode/DerivedData" \
              -path '*/Build/Products/Debug-iphonesimulator/QuietDriveLab.app' \
              -type d \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "QuietDriveLab.app was not found."
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$RUNNER_TEMP/QuietDriveLab-4.12-simulator.zip"

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuietDriveLab-4.12-simulator
          path: ${{ runner.temp }}/QuietDriveLab-4.12-simulator.zip
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/select_quietdrive_simulator.py <<'PY'
          import json
          import re
          import sys

          payload = json.load(sys.stdin)
          candidates = []

          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue

              match = re.search(r"iOS-(\\d+)(?:-(\\d+))?", runtime)
              version = (
                  int(match.group(1)),
                  int(match.group(2) or 0),
              ) if match else (0, 0)

              for device in devices:
                  if (
                      device.get("isAvailable", False)
                      and device.get("name", "").startswith("iPhone")
                  ):
                      candidates.append(
                          (version, device["udid"])
                      )

          if not candidates:
              raise SystemExit(
                  "No available iPhone simulator found."
              )

          print(max(candidates)[1])
          PY

          DEVICE_ID="$(
            xcrun simctl list devices available -j |
            python3 /tmp/select_quietdrive_simulator.py
          )"

          cat > /tmp/run_quietdrive_command.py <<'PY'
          import os
          import signal
          import subprocess
          import sys

          timeout_seconds = int(sys.argv[1])
          command = sys.argv[2:]
          process = subprocess.Popen(
              command,
              start_new_session=True,
          )

          try:
              return_code = process.wait(
                  timeout=timeout_seconds
              )
          except subprocess.TimeoutExpired:
              print(
                  f"Command timed out after {timeout_seconds} seconds: "
                  + " ".join(command),
                  flush=True,
              )
              os.killpg(
                  process.pid,
                  signal.SIGTERM,
              )
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  os.killpg(
                      process.pid,
                      signal.SIGKILL,
                  )
                  process.wait()
              raise SystemExit(124)

          raise SystemExit(return_code)
          PY

          prepare_simulator() {
            echo "Preparing simulator $DEVICE_ID"

            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl erase "$DEVICE_ID"
            xcrun simctl boot "$DEVICE_ID"

            python3 /tmp/run_quietdrive_command.py \
              120 \
              xcrun simctl bootstatus "$DEVICE_ID" -b
          }

          set +e
          prepare_simulator
          BOOT_EXIT=$?
          set -e

          if [ "$BOOT_EXIT" -eq 124 ]; then
            echo "Simulator boot wedged; resetting and retrying once."

            set +e
            prepare_simulator
            BOOT_EXIT=$?
            set -e
          fi

          if [ "$BOOT_EXIT" -ne 0 ]; then
            echo "Simulator failed to become ready with exit code $BOOT_EXIT."
            xcrun simctl list devices
            exit "$BOOT_EXIT"
          fi

          run_tests() {
            python3 /tmp/run_quietdrive_command.py \
              360 \
              xcodebuild \
              -project QuietDriveLab.xcodeproj \
              -scheme QuietDriveLab \
              -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" \
              -destination-timeout 60 \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building
          }

          echo "Running tests on simulator $DEVICE_ID"

          set +e
          run_tests
          TEST_EXIT=$?
          set -e

          if [ "$TEST_EXIT" -eq 124 ]; then
            echo "Simulator test process wedged; resetting simulator and retrying once."

            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl erase "$DEVICE_ID"
            xcrun simctl boot "$DEVICE_ID"
            xcrun simctl bootstatus "$DEVICE_ID" -b

            set +e
            run_tests
            TEST_EXIT=$?
            set -e
          fi

          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "Unit tests failed with exit code $TEST_EXIT; simulator state follows:"
            xcrun simctl list devices
            exit "$TEST_EXIT"
          fi
