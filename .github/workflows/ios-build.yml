name: iOS Build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app and tests for simulator
        run: >-
          xcodebuild
          -project QuietDriveLab.xcodeproj
          -scheme QuietDriveLab
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
      - name: Run unit tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/select_quietdrive_simulator.py <<'PY'
          import json
          import re
          import sys

          payload = json.load(sys.stdin)
          candidates = []

          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue

              match = re.search(r"iOS-(\\d+)(?:-(\\d+))?", runtime)
              version = (
                  int(match.group(1)),
                  int(match.group(2) or 0),
              ) if match else (0, 0)

              for device in devices:
                  if (
                      device.get("isAvailable", False)
                      and device.get("name", "").startswith("iPhone")
                  ):
                      candidates.append(
                          (version, device["udid"])
                      )

          if not candidates:
              raise SystemExit(
                  "No available iPhone simulator found."
              )

          print(max(candidates)[1])
          PY

          DEVICE_ID="$(
            xcrun simctl list devices available -j |
            python3 /tmp/select_quietdrive_simulator.py
          )"

          echo "Preparing simulator $DEVICE_ID"

          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo "Running tests on simulator $DEVICE_ID"

          if ! xcodebuild \
            -project QuietDriveLab.xcodeproj \
            -scheme QuietDriveLab \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -destination-timeout 60 \
            CODE_SIGNING_ALLOWED=NO \
            test
          then
            echo "Unit tests failed; simulator state follows:"
            xcrun simctl list devices
            exit 1
          fi
