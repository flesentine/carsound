name: iOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app and tests for simulator
        run: >-
          xcodebuild
          -project QuietDriveLab.xcodeproj
          -scheme QuietDriveLab
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_ID="$(
            xcrun simctl list devices available -j |
            python3 -c '
import json
import re
import sys

payload = json.load(sys.stdin)
candidates = []

for runtime, devices in payload.get("devices", {}).items():
    if "iOS" not in runtime:
        continue

    match = re.search(r"iOS-(\\d+)(?:-(\\d+))?", runtime)
    version = (
        int(match.group(1)),
        int(match.group(2) or 0),
    ) if match else (0, 0)

    for device in devices:
        if (
            device.get("isAvailable", False)
            and device.get("name", "").startswith("iPhone")
        ):
            candidates.append((version, device["udid"]))

if not candidates:
    raise SystemExit("No available iPhone simulator found.")

print(max(candidates)[1])
'
          )"

          echo "Running tests on simulator $DEVICE_ID"

          xcodebuild \
            -project QuietDriveLab.xcodeproj \
            -scheme QuietDriveLab \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
