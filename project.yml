name: QuietDriveLab
options:
  bundleIdPrefix: com.quietdrive
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QuietDriveLab:
    type: application
    platform: iOS
    sources:
      - path: QuietDriveLab
    info:
      path: QuietDriveLab/Resources/Info.plist
      properties:
        CFBundleDisplayName: QuietDrive Lab
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: QuietDrive Lab uses the microphone to measure cabin noise and analyze low-frequency sound. Raw microphone audio is not saved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietdrive.lab
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - QuietDriveLabTests
  QuietDriveLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuietDriveLabTests
    dependencies:
      - target: QuietDriveLab
